name: Build

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # package.json pins yarn 4 via "packageManager"; corepack provides it
      - name: Enable corepack
        run: corepack enable

      # yarn.lock resolves irc-framework via git+ssh; runners have no SSH key
      - name: Fetch GitHub deps over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production

      - name: Test
        run: yarn test:mocha
